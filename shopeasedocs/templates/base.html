{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}ShopEase Documentation - Help, guides, and resources{% endblock %}">
    <title>{% block title %}ShopEase Documentation{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'documentation/css/pygments.css' %}">

    {% block extra_css %}{% endblock %}

    <!-- Theme initialization (prevent flash) -->
    <script>
        (function() {
            var t = localStorage.getItem('shopeasedocs-theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
</head>
<body>
    {% include 'includes/navbar.html' %}

    {% include 'includes/messages.html' %}

    {% block content %}{% endblock %}

    {% include 'includes/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'documentation/js/search-autocomplete.js' %}"></script>

    <!-- Theme Toggle Script -->
    <script>
    (function() {
        var html = document.documentElement;
        var lightIcon = document.getElementById('theme-icon-light');
        var darkIcon = document.getElementById('theme-icon-dark');
        var toggleBtn = document.getElementById('theme-toggle');

        function applyTheme(theme) {
            html.setAttribute('data-bs-theme', theme);
            localStorage.setItem('shopeasedocs-theme', theme);
            if (theme === 'dark') {
                lightIcon.style.display = 'inline';
                darkIcon.style.display = 'none';
            } else {
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'inline';
            }
        }

        // Apply saved theme
        applyTheme(localStorage.getItem('shopeasedocs-theme') || 'light');

        toggleBtn.addEventListener('click', function() {
            var current = html.getAttribute('data-bs-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });
    })();
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
