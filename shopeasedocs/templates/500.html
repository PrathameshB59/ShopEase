<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - ShopEase Docs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container text-center py-5" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="error-page">
                    <h1 class="display-1 fw-bold text-danger mb-4" style="font-size: 8rem;">500</h1>
                    <h2 class="mb-4">Internal Server Error</h2>
                    <p class="lead text-muted mb-4">
                        Something went wrong on our end. We're working to fix it!
                    </p>
                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle me-2"></i>
                        Our team has been notified and is investigating the issue.
                    </div>
                    <div class="d-grid gap-3 d-md-flex justify-content-md-center mt-5">
                        <a href="/" class="btn btn-primary btn-lg px-4">
                            <i class="bi bi-house-door me-2"></i>Go to Homepage
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg px-4">
                            <i class="bi bi-arrow-left me-2"></i>Go Back
                        </a>
                    </div>
                    <div class="mt-5">
                        <p class="text-muted">
                            <small>
                                If the problem persists, please contact our support team.
                            </small>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
