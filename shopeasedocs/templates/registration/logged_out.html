{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - ShopEase Docs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .check-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #28a745, #20c997);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .check-icon i { font-size: 2rem; color: #fff; }
        h2 { font-weight: 700; color: #1a1a2e; }
        p { color: #6c757d; }
        .btn-back {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
        .btn-back:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .btn-login {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="check-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2>Signed Out</h2>
        <p>You have been successfully logged out.</p>
        <div>
            <a href="{% url 'documentation:doc_home' %}" class="btn-back">
                <i class="bi bi-house-door me-2"></i>Go to Documentation
            </a>
        </div>
        <div>
            <a href="{% url 'login' %}" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in again
            </a>
        </div>
    </div>
</body>
</html>
